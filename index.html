<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Peserta & Berkas Google Drive</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white shadow-xl rounded-2xl w-full max-w-2xl p-6 md:p-8">
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-2">Pencarian Peserta & Certificate</h2>
        <p class="text-center text-slate-500 text-sm mb-6">Masukkan nama, pilih bidang, dan jenjang sekolah untuk mencari berkas di Google Drive.</p>

        <form id="searchForm" class="space-y-4">
            <!-- Input Nama -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Peserta</label>
                <input type="text" id="inputNama" required placeholder="Contoh: Ahmad Fauzi" 
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Select Bidang -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Bidang Lomba / Kegiatan</label>
                    <select id="selectBidang" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800">
                        <option value="">-- Pilih Bidang --</option>
                        <option value="Matematika">Matematika</option>
                        <option value="IPA">IPA</option>
                        <option value="IPS">IPS</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                        <option value="Umum">Umum</option>
                    </select>
                </div>

                <!-- Select Jenjang -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Jenjang Sekolah</label>
                    <select id="selectJenjang" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800">
                        <option value="">-- Pilih Jenjang --</option>
                        <option value="SD/MI">SD/MI</option>
                        <option value="SMP/MTS">SMP/MTS</option>
                        <option value="SMA/SMK/MA">SMA/SMK/MA</option>
                    </select>
                </div>
            </div>

            <!-- Tombol Cari -->
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-md transition duration-200">
                Cari Berkas Peserta
            </button>
        </form>

        <!-- Tempat Hasil Pencarian -->
        <div id="hasilPencarian" class="mt-6 hidden">
            <h3 class="font-semibold text-slate-700 mb-3">Hasil Pencarian:</h3>
            <div id="daftarHasil" class="space-y-3"></div>
        </div>
    </div>

    <script>
        // GANTI ID FOLDER GOOGLE DRIVE UTAMA ANDA DI SINI (Opsional untuk pencarian langsung)
        const GOOGLE_DRIVE_FOLDER_ID = "PASTE_ID_FOLDER_DRIVE_DISINI";

        // DATA PESERTA (Bisa Anda tambah secara manual atau diambil dari Google Sheets)
        const dataPeserta = [
            {
                nama: "Ahmad Fauzi",
                bidang: "Matematika",
                jenjang: "SD/MI",
                driveUrl: "https://drive.google.com/file/d/EXAMPLE_FILE_ID_1/view"
            },
            {
                nama: "Siti Nurhaliza",
                bidang: "IPA",
                jenjang: "SMP/MTS",
                driveUrl: "https://drive.google.com/file/d/EXAMPLE_FILE_ID_2/view"
            },
            {
                nama: "Budi Santoso",
                bidang: "Bahasa Inggris",
                jenjang: "SMA/SMK/MA",
                driveUrl: "https://drive.google.com/file/d/EXAMPLE_FILE_ID_3/view"
            }
        ];

        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nama = document.getElementById('inputNama').value.trim().toLowerCase();
            const bidang = document.getElementById('selectBidang').value;
            const jenjang = document.getElementById('selectJenjang').value;

            // Filter data lokal
            const hasil = dataPeserta.filter(p => 
                p.nama.toLowerCase().includes(nama) &&
                p.bidang === bidang &&
                p.jenjang === jenjang
            );

            const container = document.getElementById('hasilPencarian');
            const daftar = document.getElementById('daftarHasil');
            daftar.innerHTML = '';
            container.classList.remove('hidden');

            if (hasil.length > 0) {
                hasil.forEach(item => {
                    daftar.innerHTML += `
                        <div class="p-4 border rounded-xl bg-slate-50 flex flex-col md:flex-row md:items-center justify-between gap-3">
                            <div>
                                <p class="font-bold text-slate-800">${item.nama}</p>
                                <p class="text-xs text-slate-500">${item.bidang} • ${item.jenjang}</p>
                            </div>
                            <a href="${item.driveUrl}" target="_blank" class="inline-flex items-center justify-center px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg">
                                Buka di Drive
                            </a>
                        </div>
                    `;
                });
            } else {
                // Jika tidak ditemukan di data lokal, sediakan tombol cari otomatis di Google Drive
                const searchQuery = encodeURIComponent(`${nama} ${bidang} ${jenjang}`);
                const driveSearchUrl = `https://drive.google.com/drive/search?q=${searchQuery}`;

                daftar.innerHTML = `
                    <div class="p-4 border border-amber-200 bg-amber-50 rounded-xl text-center">
                        <p class="text-sm text-amber-800 mb-3">Peserta tidak ditemukan di database presisi, ingin mencari berkas nama tersebut di folder Google Drive?</p>
                        <a href="${driveSearchUrl}" target="_blank" class="inline-block px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium rounded-lg">
                            Cari Otomatis di Google Drive
                        </a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
